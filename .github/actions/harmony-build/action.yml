name: Harmony build
description: Install dependencies and build the unsigned Harmony Release HAP. Run harmony-toolchain first.

runs:
  using: composite
  steps:
    # Caches only apply on hosted runners (harmony-toolchain sets HARMONY_HOSTED). They are
    # scoped to the branch that wrote them plus the default branch, so builds that share a
    # branch share caches; keep Harmony UI work on one long-lived branch.
    - name: Restore the ohpm download cache
      if: ${{ env.HARMONY_HOSTED == 'true' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.ohpm/cache
        key: ohpm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ohpm-${{ runner.os }}-
    - name: Restore the compiler cache
      if: ${{ env.HARMONY_HOSTED == 'true' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/ccache
        key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ github.ref_name }}-
          ccache-${{ runner.os }}-
    - name: Restore the Metro transform cache
      if: ${{ env.HARMONY_HOSTED == 'true' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: /tmp/metro-cache
        key: metro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
        restore-keys: |
          metro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
          metro-${{ runner.os }}-
    - name: Install and build the native HAP
      shell: bash
      # A cold hosted build spends about 14 minutes in Hvigor and the expo-harmony CLI
      # kills the build after 15, so give it room before the job timeout applies.
      env:
        EXPO_HARMONY_HVIGOR_BUILD_TIMEOUT_MS: "2700000"
      run: |
        npm ci --no-audit --no-fund
        # The SDK's bundled libraries stay out of Node's path until the Harmony tools run.
        if [ -n "${HARMONY_LD_LIBRARY_PATH:-}" ]; then
          export LD_LIBRARY_PATH="$HARMONY_LD_LIBRARY_PATH${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        fi
        # npm ci does not build the workspace packages; the Hermes export needs their dist output.
        npm run build:app-deps
        # prepare builds the module HARs but also leaves a stub harmony/ directory that
        # makes prebuild skip project generation. Remove the stub, then generate.
        npm run harmony:prepare --workspace=@getpaseo/app
        rm -rf packages/app/harmony
        npm exec --workspace=@getpaseo/app -- expo-harmony prebuild
        npm run harmony:build
        npm run harmony:doctor
        npm run harmony:modules --workspace=@getpaseo/app
    - name: Show cache statistics
      if: ${{ always() && env.HARMONY_HOSTED == 'true' }}
      shell: bash
      run: |
        # A warm native build shows a high ccache hit rate here; a cold one shows none.
        ccache --show-stats --verbose || true
        du -sh ~/.ohpm/cache ~/.cache/ccache /tmp/metro-cache 2>/dev/null || true
